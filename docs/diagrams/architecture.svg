<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 924" width="1600" height="924" role="img" aria-label="How a spoken turn reaches the support agent and comes back as speech"><title>How a spoken turn reaches the support agent and comes back as speech</title><defs><marker id="dk-a" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="context-stroke"/></marker></defs><rect width="1600" height="924" rx="28" fill="#e9e9e7" data-id="canvas"/><text x="64.0" y="84.0" font-family="Cascadia Mono, SFMono-Regular, Consolas, ui-monospace, monospace" font-size="15" font-weight="600" fill="#fe6608" text-anchor="start" letter-spacing="2" data-box="canvas">FDE PORTFOLIO · 06</text><text x="64.0" y="128.0" font-family="Segoe UI, Inter, -apple-system, Helvetica, Arial, sans-serif" font-size="34" font-weight="700" fill="#141414" text-anchor="start" letter-spacing="0.0" data-box="canvas">How a spoken turn reaches the support agent and comes back as speech</text><rect x="64.0" y="305.0" width="277.4" height="280.0" rx="16" fill="#ffffff" stroke="#d2d0cb" stroke-width="1.5" data-id="customer"/><text x="86.0" y="341.0" font-family="Cascadia Mono, SFMono-Regular, Consolas, ui-monospace, monospace" font-size="13" font-weight="600" fill="#fe6608" text-anchor="start" letter-spacing="1.5" data-box="customer">CHANNEL</text><text x="86.0" y="379.0" font-family="Segoe UI, Inter, -apple-system, Helvetica, Arial, sans-serif" font-size="22" font-weight="650" fill="#141414" text-anchor="start" letter-spacing="0.0" data-box="customer">Customer</text><text x="86.0" y="413.0" font-family="Segoe UI, Inter, -apple-system, Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#55534f" text-anchor="start" letter-spacing="0.0" data-box="customer">Browser page, hold to talk</text><text x="86.0" y="437.0" font-family="Segoe UI, Inter, -apple-system, Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#55534f" text-anchor="start" letter-spacing="0.0" data-box="customer">Live transcript, reply text, reply</text><text x="86.0" y="461.0" font-family="Segoe UI, Inter, -apple-system, Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#55534f" text-anchor="start" letter-spacing="0.0" data-box="customer">audio</text><text x="86.0" y="485.0" font-family="Segoe UI, Inter, -apple-system, Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#55534f" text-anchor="start" letter-spacing="0.0" data-box="customer">Confirm and Cancel card stays</text><text x="86.0" y="509.0" font-family="Segoe UI, Inter, -apple-system, Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#55534f" text-anchor="start" letter-spacing="0.0" data-box="customer">up while an action may wait</text><rect x="397.4" y="305.0" width="277.4" height="280.0" rx="16" fill="#ffffff" stroke="#d2d0cb" stroke-width="1.5" data-id="listen"/><text x="419.4" y="341.0" font-family="Cascadia Mono, SFMono-Regular, Consolas, ui-monospace, monospace" font-size="13" font-weight="600" fill="#fe6608" text-anchor="start" letter-spacing="1.5" data-box="listen">SPEECH IN</text><text x="419.4" y="379.0" font-family="Segoe UI, Inter, -apple-system, Helvetica, Arial, sans-serif" font-size="22" font-weight="650" fill="#141414" text-anchor="start" letter-spacing="0.0" data-box="listen">Listen</text><text x="419.4" y="413.0" font-family="Segoe UI, Inter, -apple-system, Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#55534f" text-anchor="start" letter-spacing="0.0" data-box="listen">PyAV decodes webm, ogg, wav</text><text x="419.4" y="437.0" font-family="Segoe UI, Inter, -apple-system, Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#55534f" text-anchor="start" letter-spacing="0.0" data-box="listen">or mp4 to 16 kHz mono, 60 s</text><text x="419.4" y="461.0" font-family="Segoe UI, Inter, -apple-system, Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#55534f" text-anchor="start" letter-spacing="0.0" data-box="listen">cap</text><text x="419.4" y="485.0" font-family="Segoe UI, Inter, -apple-system, Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#55534f" text-anchor="start" letter-spacing="0.0" data-box="listen">faster-whisper small, int8, CPU,</text><text x="419.4" y="509.0" font-family="Segoe UI, Inter, -apple-system, Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#55534f" text-anchor="start" letter-spacing="0.0" data-box="listen">with a Larkfield prompt</text><text x="419.4" y="533.0" font-family="Segoe UI, Inter, -apple-system, Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#55534f" text-anchor="start" letter-spacing="0.0" data-box="listen">Fillers dropped, spoken order</text><text x="419.4" y="557.0" font-family="Segoe UI, Inter, -apple-system, Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#55534f" text-anchor="start" letter-spacing="0.0" data-box="listen">ids become LC-1150</text><rect x="730.9" y="196.0" width="471.7" height="498.0" rx="16" fill="#fe6608" stroke="none" stroke-width="1.5" data-id="core"/><text x="752.9" y="232.0" font-family="Cascadia Mono, SFMono-Regular, Consolas, ui-monospace, monospace" font-size="13" font-weight="600" fill="#141414" text-anchor="start" letter-spacing="1.5" data-box="core">VOICE RULES</text><text x="752.9" y="274.0" font-family="Segoe UI, Inter, -apple-system, Helvetica, Arial, sans-serif" font-size="26" font-weight="700" fill="#141414" text-anchor="start" letter-spacing="0.0" data-box="core">POST /voice/turn</text><text x="752.9" y="302.0" font-family="Segoe UI, Inter, -apple-system, Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#141414" text-anchor="start" letter-spacing="0.0" data-box="core">Local, CPU only, no agent logic copied</text><rect x="752.9" y="322.0" width="427.7" height="178.0" rx="16" fill="#ffffff" stroke="none" stroke-width="1.5" data-id="gate"/><text x="774.9" y="366.0" font-family="Segoe UI, Inter, -apple-system, Helvetica, Arial, sans-serif" font-size="22" font-weight="650" fill="#141414" text-anchor="start" letter-spacing="0.0" data-box="gate">Gate</text><text x="774.9" y="400.0" font-family="Segoe UI, Inter, -apple-system, Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#55534f" text-anchor="start" letter-spacing="0.0" data-box="gate">No speech or low confidence is never sent</text><text x="774.9" y="424.0" font-family="Segoe UI, Inter, -apple-system, Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#55534f" text-anchor="start" letter-spacing="0.0" data-box="gate">While an action may wait, only a whole-utterance</text><text x="774.9" y="448.0" font-family="Segoe UI, Inter, -apple-system, Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#55534f" text-anchor="start" letter-spacing="0.0" data-box="gate">yes or a clear no passes</text><text x="774.9" y="472.0" font-family="Segoe UI, Inter, -apple-system, Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#55534f" text-anchor="start" letter-spacing="0.0" data-box="gate">Unknown pending state counts as pending</text><rect x="752.9" y="518.0" width="427.7" height="154.0" rx="16" fill="#141414" stroke="none" stroke-width="1.5" data-id="ask"/><text x="774.9" y="562.0" font-family="Segoe UI, Inter, -apple-system, Helvetica, Arial, sans-serif" font-size="22" font-weight="650" fill="#e9e9e7" text-anchor="start" letter-spacing="0.0" data-box="ask">Ask project 1</text><text x="774.9" y="596.0" font-family="Segoe UI, Inter, -apple-system, Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#c9c7c2" text-anchor="start" letter-spacing="0.0" data-box="ask">POST /chat with session id voice-xxx</text><text x="774.9" y="620.0" font-family="Segoe UI, Inter, -apple-system, Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#c9c7c2" text-anchor="start" letter-spacing="0.0" data-box="ask">Only confirm true or false is passed for writes</text><text x="774.9" y="644.0" font-family="Segoe UI, Inter, -apple-system, Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#c9c7c2" text-anchor="start" letter-spacing="0.0" data-box="ask">Never retried; a down agent is spoken as such</text><rect x="1258.6" y="196.0" width="277.4" height="256.0" rx="16" fill="#ffffff" stroke="#d2d0cb" stroke-width="1.5" data-id="speak"/><text x="1280.6" y="232.0" font-family="Cascadia Mono, SFMono-Regular, Consolas, ui-monospace, monospace" font-size="13" font-weight="600" fill="#fe6608" text-anchor="start" letter-spacing="1.5" data-box="speak">SPEECH OUT</text><text x="1280.6" y="270.0" font-family="Segoe UI, Inter, -apple-system, Helvetica, Arial, sans-serif" font-size="22" font-weight="650" fill="#141414" text-anchor="start" letter-spacing="0.0" data-box="speak">Speak</text><text x="1280.6" y="304.0" font-family="Segoe UI, Inter, -apple-system, Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#55534f" text-anchor="start" letter-spacing="0.0" data-box="speak">Citations dropped, ids spelled,</text><text x="1280.6" y="328.0" font-family="Segoe UI, Inter, -apple-system, Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#55534f" text-anchor="start" letter-spacing="0.0" data-box="speak">rupees and dates spoken</text><text x="1280.6" y="352.0" font-family="Segoe UI, Inter, -apple-system, Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#55534f" text-anchor="start" letter-spacing="0.0" data-box="speak">Pending action read in full from</text><text x="1280.6" y="376.0" font-family="Segoe UI, Inter, -apple-system, Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#55534f" text-anchor="start" letter-spacing="0.0" data-box="speak">pending_action</text><text x="1280.6" y="400.0" font-family="Segoe UI, Inter, -apple-system, Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#55534f" text-anchor="start" letter-spacing="0.0" data-box="speak">piper en_US-lessac-medium,</text><text x="1280.6" y="424.0" font-family="Segoe UI, Inter, -apple-system, Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#55534f" text-anchor="start" letter-spacing="0.0" data-box="speak">CPU</text><rect x="1258.6" y="486.0" width="277.4" height="208.0" rx="16" fill="#ffffff" stroke="#d2d0cb" stroke-width="1.5" data-id="reply"/><text x="1280.6" y="522.0" font-family="Cascadia Mono, SFMono-Regular, Consolas, ui-monospace, monospace" font-size="13" font-weight="600" fill="#fe6608" text-anchor="start" letter-spacing="1.5" data-box="reply">OUTPUT</text><text x="1280.6" y="560.0" font-family="Segoe UI, Inter, -apple-system, Helvetica, Arial, sans-serif" font-size="22" font-weight="650" fill="#141414" text-anchor="start" letter-spacing="0.0" data-box="reply">Reply</text><text x="1280.6" y="594.0" font-family="Segoe UI, Inter, -apple-system, Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#55534f" text-anchor="start" letter-spacing="0.0" data-box="reply">Wav plus text and per-stage</text><text x="1280.6" y="618.0" font-family="Segoe UI, Inter, -apple-system, Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#55534f" text-anchor="start" letter-spacing="0.0" data-box="reply">timings</text><text x="1280.6" y="642.0" font-family="Segoe UI, Inter, -apple-system, Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#55534f" text-anchor="start" letter-spacing="0.0" data-box="reply">Hand-offs and errors are spoken</text><text x="1280.6" y="666.0" font-family="Segoe UI, Inter, -apple-system, Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#55534f" text-anchor="start" letter-spacing="0.0" data-box="reply">too</text><rect x="64.0" y="744.0" width="1472.0" height="76.0" rx="16" fill="#dcdad5" stroke="none" stroke-width="1.5" data-id="band"/><text x="88.0" y="790.0" font-family="Segoe UI, Inter, -apple-system, Helvetica, Arial, sans-serif" font-size="20" font-weight="650" fill="#141414" text-anchor="start" letter-spacing="0.0" data-box="band">No audio store</text><text x="263.2" y="790.0" font-family="Segoe UI, Inter, -apple-system, Helvetica, Arial, sans-serif" font-size="17" font-weight="400" fill="#55534f" text-anchor="start" letter-spacing="0.0" data-box="band">Upload dropped after the request · pending state in memory per session</text><text x="1512.0" y="790.0" font-family="Segoe UI, Inter, -apple-system, Helvetica, Arial, sans-serif" font-size="20" font-weight="700" fill="#141414" text-anchor="end" letter-spacing="0.0" data-box="band">Voiced end to end: 25/25 (synthetic)</text><path d="M345.4 445.0 L391.4 445.0" fill="none" stroke="#141414" stroke-width="2.5" marker-end="url(#dk-a)" stroke-linejoin="round" stroke-linecap="round"/><path d="M678.9 445.0 L724.9 445.0" fill="none" stroke="#141414" stroke-width="2.5" marker-end="url(#dk-a)" stroke-linejoin="round" stroke-linecap="round"/><path d="M1206.6 324.0 L1252.6 324.0" fill="none" stroke="#141414" stroke-width="2.5" marker-end="url(#dk-a)" stroke-linejoin="round" stroke-linecap="round"/><path d="M1397.3 456.0 L1397.3 480.0" fill="none" stroke="#141414" stroke-width="2.5" marker-end="url(#dk-a)" stroke-linejoin="round" stroke-linecap="round"/><path d="M966.7 698.0 L966.7 738.0" fill="none" stroke="#141414" stroke-width="2.5" stroke-dasharray="7 7" marker-end="url(#dk-a)" stroke-linejoin="round" stroke-linecap="round"/><text x="64.0" y="860.0" font-family="Segoe UI, Inter, -apple-system, Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#8c8a85" text-anchor="start" letter-spacing="0.0" data-box="canvas">Synthetic clips are piper speech read back by Whisper, a best case. Own voice, end to end, was 7/8.</text></svg>